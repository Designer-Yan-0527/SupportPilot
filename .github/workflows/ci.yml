name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装项目与开发依赖
        run: pip install -e ".[dev]"

      - name: 代码风格
        run: ruff format --check .

      - name: 静态检查
        run: ruff check .

      - name: 类型检查
        run: mypy

      - name: 单元测试
        run: pytest

      - name: 评测基线
        run: python -m supportpilot.eval.keyword_baseline
